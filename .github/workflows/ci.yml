name: CI

# Pull requests are tested by the pull_request event, so pushes only build
# main and the release tags (paths-ignore doesn't apply to tags). It also runs
# every day, so that a change to V master that breaks vsql is found before
# users find it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "**.rst"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.rst"

# A new push to a pull request cancels its previous run. Other runs are never
# cancelled, since a release tag has the same commit as the push to main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# There's one job for each OS and architecture. Each one runs the tests that
# work there, builds the binary for the release and generates the C for the
# amalgamation. Checks that don't depend on the OS only run on Linux x86-64,
# which has the fastest and least limited runners.
#
# The release binary is built after the tests, because set_version.sh changes
# version.v (the tests expect no version, and the checks expect no changes).
# The zip is made by "make release" (see the Makefile for what's in it), except
# on Windows, where it's made with PowerShell (with the same files), since
# there's no zip command. On Windows, libvsql.dll is in bin/ instead of lib/,
# next to vsql.exe, since Windows finds a DLL in the program's folder or on the
# PATH. Each job uploads its zip as an artifact, and the release job publishes
# them all once every job has passed, so a release is never missing a zip.
#
# Steps that use the network are retried (see retry.sh), since they sometimes
# fail for reasons that have nothing to do with vsql.
jobs:
  # Users get V master from "v up", so that's what vsql is tested and released
  # with. The commit is found once, so that every job uses the same V, and V can
  # be cached for each commit, instead of being built by every job.
  v:
    name: V master
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find V master
        id: commit
        run: |
          commit=$(.github/workflows/retry.sh git ls-remote https://github.com/vlang/v refs/heads/master | cut -f1)
          test -n "$commit"
          echo "commit=$commit" >> $GITHUB_OUTPUT

  linux:
    name: Linux (${{ matrix.name }})
    needs: v
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            name: x86-64
            v_arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            name: ARM64
            v_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-v can't be retried with retry.sh, so it's run again if it fails.
      # clean is off because it deletes V's problem matcher before the runner
      # has read it, which fails the step (mostly on the slower macOS x86-64
      # runner).
      - name: Set up V master
        id: setup-v
        continue-on-error: true
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ needs.v.outputs.commit }}
          clean: false

      - name: Remove failed V
        if: steps.setup-v.outcome == 'failure'
        run: rm -rf ~/vlang

      - name: Set up V master (retry)
        if: steps.setup-v.outcome == 'failure'
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ needs.v.outputs.commit }}
          clean: false

      - name: Show V version
        run: v version

      - name: Verify fmt
        if: matrix.arch == 'x86-64'
        run: make fmt-verify

      # vsql/y.v is generated, but committed so that "v install" works.
      - name: Verify grammar
        if: matrix.arch == 'x86-64'
        run: |
          make grammar
          git diff --exit-code vsql/y.v

      # The venv keeps the system's Python packages out, since Ubuntu's Pygments
      # is too old for Sphinx.
      - name: Verify docs
        if: matrix.arch == 'x86-64'
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          . "$RUNNER_TEMP/docs-venv/bin/activate"
          pip install -r docs/requirements.txt
          make clean-docs docs
          git diff --exit-code

      # psql is used by the server tests. It's already installed on the x86-64
      # runner.
      - name: Install psql
        run: command -v psql || (.github/workflows/retry.sh sudo apt-get update && .github/workflows/retry.sh sudo apt-get install -y postgresql-client)

      - name: Run tests
        run: make test

      - name: Build binary
        run: |
          .github/workflows/set_version.sh
          make bin/vsql
          .github/workflows/hello-test.sh bin/vsql
          make release VERSION=${GITHUB_REF##*/}

      # The amalgamation's C has to be generated on each OS and architecture
      # (see the release job).
      - name: Generate amalgamation C
        run: |
          scripts/amalgamation.sh generate amalgamation-linux-${{ matrix.v_arch }}
          scripts/amalgamation.sh check amalgamation-linux-${{ matrix.v_arch }}

      - name: Upload amalgamation C
        uses: actions/upload-artifact@v7
        with:
          name: amalgamation-linux-${{ matrix.v_arch }}
          path: amalgamation-linux-${{ matrix.v_arch }}

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: vsql-*-linux-${{ matrix.arch }}.zip

  macos:
    name: macOS (${{ matrix.name }})
    needs: v
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            name: x86-64
            v_arch: amd64
            runner: macos-15-intel
          - arch: arm64
            name: ARM64
            v_arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-v can't be retried with retry.sh, so it's run again if it fails.
      # clean is off because it deletes V's problem matcher before the runner
      # has read it, which fails the step (mostly on the slower macOS x86-64
      # runner).
      - name: Set up V master
        id: setup-v
        continue-on-error: true
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ needs.v.outputs.commit }}
          clean: false

      - name: Remove failed V
        if: steps.setup-v.outcome == 'failure'
        run: rm -rf ~/vlang

      - name: Set up V master (retry)
        if: steps.setup-v.outcome == 'failure'
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ needs.v.outputs.commit }}
          clean: false

      - name: Show V version
        run: v version

      # libpq is keg-only, so psql must be added to the PATH. It's used by the
      # server tests.
      - name: Install psql
        run: |
          .github/workflows/retry.sh brew install libpq
          echo "$(brew --prefix libpq)/bin" >> $GITHUB_PATH

      - name: Run tests
        run: make test

      - name: Build binary
        run: |
          .github/workflows/set_version.sh
          make bin/vsql
          .github/workflows/hello-test.sh bin/vsql
          make release VERSION=${GITHUB_REF##*/}

      # The amalgamation's C has to be generated on each OS and architecture
      # (see the release job).
      - name: Generate amalgamation C
        run: |
          scripts/amalgamation.sh generate amalgamation-macos-${{ matrix.v_arch }}
          scripts/amalgamation.sh check amalgamation-macos-${{ matrix.v_arch }}

      - name: Upload amalgamation C
        uses: actions/upload-artifact@v7
        with:
          name: amalgamation-macos-${{ matrix.v_arch }}
          path: amalgamation-macos-${{ matrix.v_arch }}

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: vsql-*-macos-${{ matrix.arch }}.zip

  # The test suites don't run on Windows yet, so this builds the binary and runs
  # some statements, a short benchmark and the server with it.
  windows:
    name: Windows (${{ matrix.name }})
    needs: v
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            name: x86-64
            v_arch: amd64
            runner: windows-latest
          - arch: arm64
            name: ARM64
            v_arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The runner's MinGW (and the V that setup-v builds) is x86-64, which runs
      # emulated on ARM64, so its programs and C would be x86-64 too.
      # llvm-mingw's native ARM64 toolchain is used instead, which has gcc and
      # make (clang and lld, as MinGW).
      - name: Install llvm-mingw
        if: matrix.arch == 'arm64'
        run: |
          .github/workflows/retry.sh curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-aarch64.zip
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/llvm-mingw-20261020-ucrt-aarch64/bin" >> $GITHUB_PATH

      # setup-v can't be retried with retry.sh, so it's run again if it fails.
      # clean is off because it deletes V's problem matcher before the runner
      # has read it, which fails the step (mostly on the slower macOS x86-64
      # runner).
      - name: Set up V master
        id: setup-v
        continue-on-error: true
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ needs.v.outputs.commit }}
          clean: false

      - name: Remove failed V
        if: steps.setup-v.outcome == 'failure'
        run: rm -rf ~/vlang

      - name: Set up V master (retry)
        if: steps.setup-v.outcome == 'failure'
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ needs.v.outputs.commit }}
          clean: false

      - name: Build V for ARM64
        if: matrix.arch == 'arm64'
        shell: cmd
        run: |
          for /f "delims=" %%i in ('where v') do cd /d %%~dpi
          call makev.bat -clang

      - name: Show V version
        run: v version

      - name: Build binary
        run: |
          .github/workflows/set_version.sh
          v -n -nocache -prod -cc gcc cmd/vsql-cli -o bin/vsql.exe
          .github/workflows/hello-test.sh bin/vsql.exe

      # The programs are built in bin/, next to libvsql.dll, since Windows has
      # no rpath.
      - name: Run libvsql tests
        run: |
          make libvsql-test libvsql-example

      # psql is used by the server tests. PostgreSQL is installed on the x86-64
      # runner (but isn't on the PATH), and not on the ARM64 one.
      - name: Install psql
        if: env.PGBIN == ''
        run: |
          .github/workflows/retry.sh choco install postgresql17 --no-progress -y --params '/Password:postgres'
          echo "PGBIN=C:\Program Files\PostgreSQL\17\bin" >> $GITHUB_ENV

      - name: Run tests
        run: |
          export PATH="$(cygpath -u "$PGBIN"):$PATH"
          .github/workflows/windows-test.sh bin/vsql.exe

      - name: Zip binary
        shell: pwsh
        run: |
          $dir = "vsql-$("$env:GITHUB_REF".Split('/')[-1])-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory $dir/bin, $dir/include
          Copy-Item bin/vsql.exe, bin/libvsql.dll $dir/bin
          Copy-Item libvsql/libvsql.h $dir/include
          Copy-Item libvsql/example.c $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      # The amalgamation's C has to be generated on each OS and architecture
      # (see the release job).
      - name: Generate amalgamation C
        run: |
          scripts/amalgamation.sh generate amalgamation-windows-${{ matrix.v_arch }}
          scripts/amalgamation.sh check amalgamation-windows-${{ matrix.v_arch }}

      - name: Upload amalgamation C
        uses: actions/upload-artifact@v7
        with:
          name: amalgamation-windows-${{ matrix.v_arch }}
          path: amalgamation-windows-${{ matrix.v_arch }}

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: vsql-*-windows-${{ matrix.arch }}.zip

  # The release job makes and tests the amalgamation, then publishes it with
  # the other zips on a tag, once every job has passed. Uploading replaces a zip
  # that's already there, so the job can be run again.
  #
  # The amalgamation is the C for vsql and libvsql, so that they can be built
  # without V (see scripts/amalgamation.sh). It has the C from each OS and
  # architecture, which has already been built and tested with it.
  release:
    name: Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download C and zips
        uses: actions/download-artifact@v8

      - name: Zip amalgamation
        run: |
          scripts/amalgamation.sh package ${GITHUB_REF##*/} amalgamation-*/
          unzip -l vsql-*-amalgamation.zip

      - name: Build and test amalgamation
        run: |
          unzip -q vsql-*-amalgamation.zip
          cd vsql-*-amalgamation
          make
          ../.github/workflows/hello-test.sh bin/vsql
          make example

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l vsql-*-amalgamation.zip release-*/vsql-*.zip
          .github/workflows/retry.sh sh -c 'gh release view "$TAG" > /dev/null || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""'
          .github/workflows/retry.sh gh release upload "$TAG" vsql-*-amalgamation.zip release-*/vsql-*.zip --clobber
