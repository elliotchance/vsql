name: CI

# Every pull request into main and every tag tests every OS and architecture. A
# tag then publishes the release. It can also be run by hand with
# workflow_dispatch, which tests everything without publishing.
#
# A pull request that's stacked on another one isn't tested until it's changed
# to go into main (which happens when the one below it is merged), since it's
# tested then anyway, and each run uses a lot of the limited macOS runners. That
# change is an "edited" event, which is also sent when the title or description
# changes, so the v job (that every other job needs) only runs for an edit that
# changed the base branch.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - "**.md"
      - "**.rst"

# A new push to a pull request cancels its previous run. Other runs are never
# cancelled. An edit that doesn't change the base branch gets a group of its
# own, so that it doesn't cancel a run that's testing the pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

# There's one job for each OS and architecture. Each one runs the tests that
# work there, builds the binary for the release and generates the C for the
# amalgamation. Checks that don't depend on the OS only run on Linux x86-64,
# which has the fastest and least limited runners.
#
# The release package is built once, at the start of each job, then everything
# after that tests those binaries. It's uploaded at the end, so only what has
# passed can be published. set_version.sh only changes version.v for a tag.
# The zip is made by "make release" (see the Makefile for what's in it), except
# on Windows, where it's made with PowerShell (with the same files), since
# there's no zip command. On Windows, libvsql.dll is in bin/ instead of lib/,
# next to vsql.exe, since Windows finds a DLL in the program's folder or on the
# PATH. Each job uploads its zip as an artifact, and the release job publishes
# them all once every job has passed, so a release is never missing a zip.
#
# Steps that use the network are retried (see retry.sh), since they sometimes
# fail for reasons that have nothing to do with vsql.
jobs:
  # Users get V master from "v up", so vsql is tested and released with the
  # newest V that has been generated as C (vlang/vc), which is what V is built
  # from. It's found once, so that every job starts from the same V. A job where
  # it doesn't build uses an earlier one (see setup-v.sh).
  v:
    name: V master
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    outputs:
      vc: ${{ steps.vc.outputs.vc }}
    steps:
      # A pull request that can't be merged into its base isn't tested, since
      # the run would test an old merge (or none). GitHub works out whether it
      # can be merged after the event is sent, so this waits for that. The job
      # fails, rather than skipping the others, since a required check that's
      # skipped counts as passing. Pushing the fix starts a new run.
      - name: Check for a merge conflict
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 20); do
            mergeable=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq .mergeable || echo null)
            if [ "$mergeable" = "false" ]; then
              echo "::error::This pull request has a merge conflict with ${{ github.base_ref }}. Rebase it to run the tests."
              exit 1
            fi
            if [ "$mergeable" = "true" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "GitHub hasn't worked out whether this can be merged, so it's tested anyway."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Find V master
        id: vc
        run: |
          vc=$(.github/workflows/retry.sh git ls-remote https://github.com/vlang/vc refs/heads/master | cut -f1)
          test -n "$vc"
          echo "vc=$vc" >> $GITHUB_OUTPUT

      # A tag only tests the release build, so it can fail when every pull
      # request passes, and then nothing is released. So that it can't go
      # unnoticed, a pull request fails this job while the newest tag that has
      # finished failed and has no release. It looks at the release rather than
      # the run, because a tag run that failed only here was still released.
      # It's skipped for a tag, so that a tag's run only fails for its own
      # build or release (otherwise one failed tag would fail every tag after
      # it). It's the last step, so V master has already been found, and the
      # other jobs still run (see their "if"), so the next tag can be released.
      - name: Check the last tag
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo ${{ github.repository }} --workflow ci.yml --event push --status completed --limit 1 --json headBranch,conclusion,url --jq '.[0] | "\(.headBranch) \(.conclusion) \(.url)"')
          read -r tag conclusion url <<< "$run"
          if [ "$conclusion" = "failure" ] && ! .github/workflows/retry.sh gh release view "$tag" --repo ${{ github.repository }} > /dev/null; then
            echo "::error::The CI run of the last tag ($tag) failed, and it wasn't released: $url"
            exit 1
          fi

  # The name of the Linux x86-64 job is the check that the main ruleset
  # requires, so it mustn't change.
  linux:
    name: Linux (${{ matrix.name }})
    needs: v
    # V master is found unless the job failed before then (such as for a merge
    # conflict). Only "Check the last tag" fails after it, which doesn't stop
    # the tests.
    if: ${{ !cancelled() && needs.v.outputs.vc != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            name: x86-64
            v_arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            name: ARM64
            v_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # statuses is for the "Stats for nerds" status (see "Report stats for nerds").
    permissions:
      contents: read
      statuses: write
    # About twice the longest run on Linux, so that a test that hangs fails the
    # job instead of holding a runner for GitHub's limit of 6 hours.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up V
        run: .github/workflows/setup-v.sh ${{ needs.v.outputs.vc }}

      - name: Show V version
        run: v version

      - name: Verify fmt
        if: matrix.arch == 'x86-64'
        run: make fmt-verify

      # The output is also kept for "Report stats for nerds".
      - name: Verify standard index
        if: matrix.arch == 'x86-64'
        run: |
          set -o pipefail
          make check-standard-index 2>&1 | tee "$RUNNER_TEMP/standard-index.log"

      - name: Verify function index
        if: matrix.arch == 'x86-64'
        run: make check-function-index

      # vsql/y.v is generated, but committed so that "v install" works.
      - name: Verify grammar
        if: matrix.arch == 'x86-64'
        run: |
          make grammar
          git diff --exit-code vsql/y.v

      # The venv keeps the system's Python packages out, since Ubuntu's Pygments
      # is too old for Sphinx.
      - name: Verify docs
        if: matrix.arch == 'x86-64'
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          . "$RUNNER_TEMP/docs-venv/bin/activate"
          pip install -r docs/requirements.txt
          make clean-docs docs
          git diff --exit-code

      # This is what's released, and everything after this uses these binaries.
      # make only builds them again if a source file changes, so the source goes
      # back to having no version for the V tests, and the binaries are made newer
      # than it. The output of the build has the C compiler commands that the
      # amalgamation needs, which has to be generated on each OS and architecture
      # (see the release job).
      #
      # vsql and libvsql are built at the same time, since the C compiler only
      # uses one core for each, and they take a minute or two. y.v is made first,
      # so that they don't both make it.
      - name: Build release package
        shell: bash
        run: |
          .github/workflows/set_version.sh
          make vsql/y.v
          mkdir -p "$RUNNER_TEMP/showcc"
          make BUILD_OPTIONS=-showcc bin/vsql > "$RUNNER_TEMP/showcc/vsql.showcc" 2>&1 & vsql=$!
          make BUILD_OPTIONS=-showcc libvsql > "$RUNNER_TEMP/showcc/libvsql.showcc" 2>&1 & libvsql=$!
          status=0
          wait $vsql || status=1
          wait $libvsql || status=1
          cat "$RUNNER_TEMP/showcc/vsql.showcc" "$RUNNER_TEMP/showcc/libvsql.showcc"
          [ $status = 0 ]
          .github/workflows/hello-test.sh bin/vsql
          make release VERSION=${GITHUB_REF##*/}
          scripts/amalgamation.sh generate amalgamation-linux-${{ matrix.v_arch }} "$RUNNER_TEMP/showcc"
          scripts/amalgamation.sh check amalgamation-linux-${{ matrix.v_arch }}
          git checkout vsql/version.v
          touch bin/*

      # psql is used by the server tests. It's already installed on the x86-64
      # runner.
      - name: Install psql
        run: command -v psql || (.github/workflows/retry.sh sudo apt-get update && .github/workflows/retry.sh sudo apt-get install -y postgresql-client)

      # MAX_RUN_TIME fails big-test if a run takes 100 seconds or more (see
      # docs/testing.rst).
      # The output is also kept for "Report stats for nerds".
      #
      # The V tests are built with tcc (TEST_OPTIMIZE=, see the Makefile). With
      # gcc -O2 the SQL tests run in a third of the time, but it takes 5 to 8
      # minutes longer to build them, which is longer than it saves.
      - name: Run tests
        run: |
          set -o pipefail
          make test MAX_RUN_TIME=100 TEST_OPTIMIZE= 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Adds a summary to the commit as the "Stats for nerds" status, such as
      # "141/179 mandatory 140/432 optional 1234/7890 rules 12345 stmts 4567
      # asserts", so it can be seen in the checks of a pull request without
      # opening the run. It's kept short (no commas or separators) so GitHub
      # doesn't cut it off:
      # - The features are the mandatory and optional features of every part
      #   that are fully supported, from docs/sql-compliance.rst.
      # - The rules are the rows of the standard index that are implemented,
      #   deviates or impl-defined (see "Verify standard index"), and are left
      #   out if it failed.
      # - The statements and assertions are from the summary of the SQL tests,
      #   with the failures (and a failed status) when there are some.
      # It's skipped when the tests didn't get as far as their summary, and for
      # a pull request from a fork, since its token can't add a status.
      - name: Report stats for nerds
        if: >-
          ${{ !cancelled() && matrix.arch == 'x86-64'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          summary=$(grep -m1 '^SQL tests: ' "$RUNNER_TEMP/test.log" || true)
          if [ -z "$summary" ]; then exit 0; fi
          # Each part in the table of docs/sql-compliance.rst has a row with
          # its mandatory and optional features, such as "128 of 163" (or
          # "None"), which are added up.
          read -r mandatory mandatory_total optional optional_total < <(awk '
            /^   \* - :doc:/ { row = 1; next }
            row { row++ }
            row == 3 && /^     - [0-9]+ of [0-9]+$/ { m += $2; mt += $4 }
            row == 4 && /^     - [0-9]+ of [0-9]+$/ { o += $2; ot += $4 }
            END { print m + 0, mt + 0, o + 0, ot + 0 }
          ' docs/sql-compliance.rst)
          description="$mandatory/$mandatory_total mandatory $optional/$optional_total optional"
          rules=$(grep -m1 '^Standard index: ' "$RUNNER_TEMP/standard-index.log" 2>/dev/null || true)
          if [ -n "$rules" ]; then
            read -r covered total < <(echo "$rules" | sed -E 's/^Standard index: ([0-9]+) of ([0-9]+) rules.*$/\1 \2/')
            description="$description $covered/$total rules"
          fi
          # "SQL tests: 12345 statements, 4567 assertions, 0 failed, 5.32
          # seconds" becomes "12345 stmts 4567 asserts".
          read -r statements assertions failed < <(echo "$summary" | sed -E 's/^SQL tests: ([0-9]+) statements, ([0-9]+) assertions, ([0-9]+) failed, .*$/\1 \2 \3/')
          description="$description $statements stmts $assertions asserts"
          state=success
          if [ "$failed" != 0 ]; then
            description="$description $failed failed"
            state=failure
          fi
          echo "$description"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="Stats for nerds" \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      # The tests for "vsql app" drive it in a headless Chromium (see
      # docs/testing.rst). The page is the same everywhere, so they only run
      # here. They use the Google Chrome that's already on the runner, rather
      # than "playwright install --with-deps chromium", which needs apt and
      # fails whenever the Ubuntu mirrors can't be reached.
      - name: Run app tests
        if: matrix.arch == 'x86-64'
        run: |
          python3 -m venv "$RUNNER_TEMP/app-venv"
          . "$RUNNER_TEMP/app-venv/bin/activate"
          .github/workflows/retry.sh pip install -r app/tests/requirements.txt
          google-chrome --version
          make app-test PYTEST="--browser-channel chrome"

      - name: Upload amalgamation C
        uses: actions/upload-artifact@v7
        with:
          name: amalgamation-linux-${{ matrix.v_arch }}
          path: amalgamation-linux-${{ matrix.v_arch }}

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: vsql-*-linux-${{ matrix.arch }}.zip

  macos:
    name: macOS (${{ matrix.name }})
    needs: v
    if: ${{ !cancelled() && needs.v.outputs.vc != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            name: x86-64
            v_arch: amd64
            runner: macos-15-intel
            # The Intel runner is about three times slower than the others.
            max_run_time: 250
            # The SQL tests run in a third of the time with -O2, which saves
            # more than it takes to build them (see the Makefile).
            test_optimize: -cc cc -cflags -O2
          - arch: arm64
            name: ARM64
            v_arch: arm64
            runner: macos-latest
            max_run_time: 100
            # With -O2, it took as long to build the tests as it saved in
            # running them. -O1 builds quicker.
            test_optimize: -cc cc -cflags -O1
    runs-on: ${{ matrix.runner }}
    # About twice the longest run on macOS, so that a test that hangs fails the
    # job instead of holding a runner for GitHub's limit of 6 hours.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up V
        run: .github/workflows/setup-v.sh ${{ needs.v.outputs.vc }}

      - name: Show V version
        run: v version

      # This is what's released, and everything after this uses these binaries.
      # make only builds them again if a source file changes, so the source goes
      # back to having no version for the V tests, and the binaries are made newer
      # than it. The output of the build has the C compiler commands that the
      # amalgamation needs, which has to be generated on each OS and architecture
      # (see the release job).
      #
      # vsql and libvsql are built at the same time, since the C compiler only
      # uses one core for each, and they take a minute or two. y.v is made first,
      # so that they don't both make it.
      - name: Build release package
        shell: bash
        run: |
          .github/workflows/set_version.sh
          make vsql/y.v
          mkdir -p "$RUNNER_TEMP/showcc"
          make BUILD_OPTIONS=-showcc bin/vsql > "$RUNNER_TEMP/showcc/vsql.showcc" 2>&1 & vsql=$!
          make BUILD_OPTIONS=-showcc libvsql > "$RUNNER_TEMP/showcc/libvsql.showcc" 2>&1 & libvsql=$!
          status=0
          wait $vsql || status=1
          wait $libvsql || status=1
          cat "$RUNNER_TEMP/showcc/vsql.showcc" "$RUNNER_TEMP/showcc/libvsql.showcc"
          [ $status = 0 ]
          .github/workflows/hello-test.sh bin/vsql
          make release VERSION=${GITHUB_REF##*/}
          scripts/amalgamation.sh generate amalgamation-macos-${{ matrix.v_arch }} "$RUNNER_TEMP/showcc"
          scripts/amalgamation.sh check amalgamation-macos-${{ matrix.v_arch }}
          git checkout vsql/version.v
          touch bin/*

      # libpq is keg-only, so psql must be added to the PATH. It's used by the
      # server tests.
      - name: Install psql
        run: |
          .github/workflows/retry.sh brew install libpq
          echo "$(brew --prefix libpq)/bin" >> $GITHUB_PATH

      # MAX_RUN_TIME fails big-test if a run takes max_run_time seconds or more
      # (see docs/testing.rst).
      - name: Run tests
        run: make test MAX_RUN_TIME=${{ matrix.max_run_time }} TEST_OPTIMIZE="${{ matrix.test_optimize }}"

      - name: Upload amalgamation C
        uses: actions/upload-artifact@v7
        with:
          name: amalgamation-macos-${{ matrix.v_arch }}
          path: amalgamation-macos-${{ matrix.v_arch }}

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: vsql-*-macos-${{ matrix.arch }}.zip

  # Windows runs the same tests as the other OSs, with the binaries built with
  # MinGW (the Makefile uses bin/vsql.exe for the tests there).
  windows:
    name: Windows (${{ matrix.name }})
    needs: v
    if: ${{ !cancelled() && needs.v.outputs.vc != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            name: x86-64
            v_arch: amd64
            runner: windows-latest
          - arch: arm64
            name: ARM64
            v_arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    # About twice the longest run on Windows (ARM64 takes over an hour), so that
    # a test that hangs fails the job instead of holding a runner for GitHub's
    # limit of 6 hours.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The runner's MinGW (and the V that setup-v.sh builds) is x86-64, which runs
      # emulated on ARM64, so its programs and C would be x86-64 too.
      # llvm-mingw's native ARM64 toolchain is used instead, which has gcc and
      # make (clang and lld, as MinGW).
      - name: Install llvm-mingw
        if: matrix.arch == 'arm64'
        run: |
          .github/workflows/retry.sh curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-aarch64.zip
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/llvm-mingw-20261020-ucrt-aarch64/bin" >> $GITHUB_PATH

      - name: Set up V
        run: .github/workflows/setup-v.sh ${{ needs.v.outputs.vc }}

      - name: Build V for ARM64
        if: matrix.arch == 'arm64'
        shell: cmd
        run: |
          for /f "delims=" %%i in ('where v') do cd /d %%~dpi
          call makev.bat -clang

      - name: Show V version
        run: v version

      # This is what's released, and everything after this uses these binaries.
      # y.v is made first, otherwise the first make would make it newer than
      # vsql.exe, and build it again. The output of the build has the C compiler
      # commands that the amalgamation needs.
      #
      # vsql and libvsql are built at the same time, since the C compiler only
      # uses one core for each.
      - name: Build release package
        run: |
          .github/workflows/set_version.sh
          make vsql/y.v
          mkdir -p "$RUNNER_TEMP/showcc"
          v -n -nocache -prod -cc gcc -showcc cmd/vsql-cli -o bin/vsql.exe > "$RUNNER_TEMP/showcc/vsql.showcc" 2>&1 & vsql=$!
          make BUILD_OPTIONS=-showcc libvsql > "$RUNNER_TEMP/showcc/libvsql.showcc" 2>&1 & libvsql=$!
          status=0
          wait $vsql || status=1
          wait $libvsql || status=1
          cat "$RUNNER_TEMP/showcc/vsql.showcc" "$RUNNER_TEMP/showcc/libvsql.showcc"
          [ $status = 0 ]
          .github/workflows/hello-test.sh bin/vsql.exe
          git checkout vsql/version.v
          touch bin/*

      - name: Zip binary
        shell: pwsh
        run: |
          $dir = "vsql-$("$env:GITHUB_REF".Split('/')[-1])-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory $dir/bin, $dir/include
          Copy-Item bin/vsql.exe, bin/libvsql.dll, bin/libvsql.dll.a $dir/bin
          Copy-Item libvsql/libvsql.h $dir/include
          Copy-Item libvsql/example.c $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      # The amalgamation's C has to be generated on each OS and architecture
      # (see the release job).
      - name: Generate amalgamation C
        run: |
          scripts/amalgamation.sh generate amalgamation-windows-${{ matrix.v_arch }} "$RUNNER_TEMP/showcc"
          scripts/amalgamation.sh check amalgamation-windows-${{ matrix.v_arch }}

      # psql is used by the server tests. Neither runner has PostgreSQL, and
      # installing it takes 2 minutes on x86-64 and 10 on ARM64, so its bin/
      # folder (which has psql and the DLLs it needs) is cached. It's installed
      # when the cache is missing, or psql doesn't run from it. choco succeeds
      # even when it can't reach its feed and installs nothing, so the install
      # is retried until psql.exe exists.
      - name: Restore psql
        uses: actions/cache@v6
        with:
          path: ~/pgbin
          key: psql-17-windows-${{ matrix.arch }}

      - name: Install psql
        run: |
          pgbin=~/pgbin
          if ! "$pgbin/psql.exe" --version; then
            .github/workflows/retry.sh sh -c "choco install postgresql17 --no-progress -y --params '/Password:postgres' && test -f 'C:/Program Files/PostgreSQL/17/bin/psql.exe'"
            rm -rf "$pgbin"
            cp -R "C:/Program Files/PostgreSQL/17/bin" "$pgbin"
            "$pgbin/psql.exe" --version
          fi
          echo "PGBIN=$(cygpath -w "$pgbin")" >> $GITHUB_ENV

      # The C programs that use libvsql are built in bin/, next to
      # libvsql.dll, since Windows has no rpath.
      #
      # On ARM64, V builds without -prod with the x86-64 tcc that setup-v.sh
      # downloads, and those programs crash under emulation (even V's own test
      # runner), so everything is built with llvm-mingw's clang instead.
      #
      # The V tests aren't optimized (TEST_OPTIMIZE=, see the Makefile): on
      # Windows the SQL tests take about as long with -O2, so it would only
      # make them slower to build.
      - name: Run tests
        env:
          VFLAGS: ${{ matrix.arch == 'arm64' && '-cc clang' || '' }}
        run: |
          export PATH="$(cygpath -u "$PGBIN"):$PATH"
          make -k test TEST_OPTIMIZE=

      - name: Upload amalgamation C
        uses: actions/upload-artifact@v7
        with:
          name: amalgamation-windows-${{ matrix.v_arch }}
          path: amalgamation-windows-${{ matrix.v_arch }}

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: vsql-*-windows-${{ matrix.arch }}.zip

  # The release job makes and tests the amalgamation, then publishes it with
  # the other zips on a tag, once every job has passed. Uploading replaces a zip
  # that's already there, so the job can be run again.
  #
  # The amalgamation is the C for vsql and libvsql, so that they can be built
  # without V (see scripts/amalgamation.sh). It has the C from each OS and
  # architecture, which has already been built and tested with it.
  release:
    name: Release
    needs: [linux, macos, windows]
    # Only the jobs it needs decide whether it runs, not V master.
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download C and zips
        uses: actions/download-artifact@v8

      - name: Zip amalgamation
        run: |
          scripts/amalgamation.sh package ${GITHUB_REF##*/} amalgamation-*/
          unzip -l vsql-*-amalgamation.zip

      - name: Build and test amalgamation
        run: |
          unzip -q vsql-*-amalgamation.zip
          cd vsql-*-amalgamation
          make
          ../.github/workflows/hello-test.sh bin/vsql
          make example

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l vsql-*-amalgamation.zip release-*/vsql-*.zip
          .github/workflows/retry.sh sh -c 'gh release view "$TAG" > /dev/null || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""'
          .github/workflows/retry.sh gh release upload "$TAG" vsql-*-amalgamation.zip release-*/vsql-*.zip --clobber
