name: CI

# Pull requests are tested by the pull_request event, so pushes only build
# main and the release tags (paths-ignore doesn't apply to tags). It also runs
# every day, so that a change to V master that breaks vsql is found before
# users find it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "**.rst"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.rst"

# A new push to a pull request cancels its previous run. Other runs are never
# cancelled, since a release tag has the same commit as the push to main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# There's one job for each OS. Each one runs the tests that work there and
# builds the binary for the release. Checks that don't depend on the OS only
# run on Linux, which has the fastest and least limited runners.
#
# The release binary is built after the tests, because set_version.sh changes
# version.v (the tests expect no version, and the checks expect no changes).
# The zip is made by "make release" (see the Makefile for what's in it), except
# on Windows, where it's made with PowerShell (with the same files), since
# there's no zip command. On Windows, libvsql.dll is in bin/ instead of lib/,
# next to vsql.exe, since Windows finds a DLL in the program's folder or on the
# PATH.
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Users get V master from "v up", so that's what vsql is tested and
      # released with.
      - name: Set up V master
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Show V version
        run: v version

      - name: Verify fmt
        run: make fmt-verify

      # vsql/y.v is generated, but committed so that "v install" works.
      - name: Verify grammar
        run: |
          make grammar
          git diff --exit-code vsql/y.v

      # The venv keeps the system's Python packages out, since Ubuntu's Pygments
      # is too old for Sphinx.
      - name: Verify docs
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          . "$RUNNER_TEMP/docs-venv/bin/activate"
          pip install -r docs/requirements.txt
          make clean-docs docs
          git diff --exit-code

      # psql is already installed on the runner. It's used by the server tests.
      - name: Run tests
        run: make test

      - name: Build binary
        run: |
          .github/workflows/set_version.sh
          make bin/vsql
          .github/workflows/hello-test.sh bin/vsql
          make release VERSION=${GITHUB_REF##*/}

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            vsql-*-linux.zip

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up V master
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Show V version
        run: v version

      # libpq is keg-only, so psql must be added to the PATH. It's used by the
      # server tests.
      - name: Install psql
        run: |
          brew install libpq
          echo "$(brew --prefix libpq)/bin" >> $GITHUB_PATH

      - name: Run tests
        run: make test

      - name: Build binary
        run: |
          .github/workflows/set_version.sh
          make bin/vsql
          .github/workflows/hello-test.sh bin/vsql
          make release VERSION=${GITHUB_REF##*/}

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            vsql-*-macos.zip

  # The test suites don't run on Windows yet, so this builds the binary and runs
  # some statements, a short benchmark and the server with it.
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up V master
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Show V version
        run: v version

      - name: Build binary
        run: |
          .github/workflows/set_version.sh
          v -n -nocache -prod -cc gcc cmd/vsql-cli -o bin/vsql.exe
          .github/workflows/hello-test.sh bin/vsql.exe

      # The programs are built in bin/, next to libvsql.dll, since Windows has
      # no rpath.
      - name: Run libvsql tests
        run: |
          make libvsql-test libvsql-example

      # PostgreSQL is installed on the runner, but psql isn't on the PATH. It's
      # used by the server tests.
      - name: Run tests
        run: |
          export PATH="$(cygpath -u "$PGBIN"):$PATH"
          .github/workflows/windows-test.sh bin/vsql.exe

      - name: Zip binary
        shell: pwsh
        run: |
          $dir = "vsql-$("$env:GITHUB_REF".Split('/')[-1])-windows"
          New-Item -ItemType Directory $dir/bin, $dir/include
          Copy-Item bin/vsql.exe, bin/libvsql.dll $dir/bin
          Copy-Item libvsql/libvsql.h $dir/include
          Copy-Item libvsql/example.c $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            vsql-*-windows.zip
