name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    # The image is based on ubuntu:24.04 (see Dockerfile), which must have the
    # glibc that bin/vsql is built with.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up V master
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Build linux binaries
        run: |
          .github/workflows/set_version.sh
          make bin/vsql

      # The image is only pushed if the binary runs in it.
      - name: Test Docker image
        run: |
          docker build -t vsql-test .
          docker run --rm vsql-test version
          echo "VALUES 1;" | docker run --rm -i vsql-test cli :memory: | grep -x "1 row.*"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            elliotchance/vsql
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: elliotchance
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
