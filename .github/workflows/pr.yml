name: CI

# This is the only workflow that runs on a pull request, and it has one job, so
# that's the only check a pull request has. The macOS runners get backed up, so
# everything else is tested by a tag (see tag.yml).
#
# A tag also runs this job for each Linux architecture, by calling this
# workflow. There are no inputs on a pull request, which makes it x86-64.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.rst"
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      v_commit:
        type: string
        required: true

# A new push to a pull request cancels its previous run. Other runs are never
# cancelled, so each call from a tag needs its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.arch }}
  cancel-in-progress: true

# Checks that don't depend on the OS only run on x86-64, which has the fastest
# and least limited runners.
#
# The release package is built once, at the start of the job, then everything
# after that tests those binaries. set_version.sh only changes version.v for a
# tag. The zip is made by "make release" (see the Makefile for what's in it).
#
# Steps that use the network are retried (see retry.sh), since they sometimes
# fail for reasons that have nothing to do with vsql.
jobs:
  linux:
    name: Linux (${{ inputs.arch == 'arm64' && 'ARM64' || 'x86-64' }})
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      ARCH: ${{ inputs.arch == 'arm64' && 'arm64' || 'x86-64' }}
      V_ARCH: ${{ inputs.arch == 'arm64' && 'arm64' || 'amd64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A tag has already found V master, for all of its jobs (see tag.yml).
      - name: Find V master
        id: commit
        if: inputs.v_commit == ''
        run: |
          commit=$(.github/workflows/retry.sh git ls-remote https://github.com/vlang/v refs/heads/master | cut -f1)
          test -n "$commit"
          echo "commit=$commit" >> $GITHUB_OUTPUT

      # setup-v can't be retried with retry.sh, so it's run again if it fails.
      # clean is off because it deletes V's problem matcher before the runner
      # has read it, which fails the step (mostly on the slower macOS x86-64
      # runner).
      - name: Set up V master
        id: setup-v
        continue-on-error: true
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ inputs.v_commit || steps.commit.outputs.commit }}
          clean: false

      - name: Remove failed V
        if: steps.setup-v.outcome == 'failure'
        run: rm -rf ~/vlang

      - name: Set up V master (retry)
        if: steps.setup-v.outcome == 'failure'
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ inputs.v_commit || steps.commit.outputs.commit }}
          clean: false

      - name: Show V version
        run: v version

      - name: Verify fmt
        if: env.ARCH == 'x86-64'
        run: make fmt-verify

      - name: Verify standard index
        if: env.ARCH == 'x86-64'
        run: make check-standard-index

      # vsql/y.v is generated, but committed so that "v install" works.
      - name: Verify grammar
        if: env.ARCH == 'x86-64'
        run: |
          make grammar
          git diff --exit-code vsql/y.v

      # The venv keeps the system's Python packages out, since Ubuntu's Pygments
      # is too old for Sphinx.
      - name: Verify docs
        if: env.ARCH == 'x86-64'
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          . "$RUNNER_TEMP/docs-venv/bin/activate"
          pip install -r docs/requirements.txt
          make clean-docs docs
          git diff --exit-code

      # This is what's released, and everything after this uses these binaries.
      # make only builds them again if a source file changes, so the source goes
      # back to having no version for the V tests, and the binaries are made newer
      # than it. The output of the build has the C compiler commands that the
      # amalgamation needs, which has to be generated on each OS and architecture
      # (see the release job).
      - name: Build release package
        shell: bash
        run: |
          .github/workflows/set_version.sh
          mkdir -p "$RUNNER_TEMP/showcc"
          make BUILD_OPTIONS=-showcc bin/vsql | tee "$RUNNER_TEMP/showcc/vsql.showcc"
          make BUILD_OPTIONS=-showcc libvsql | tee "$RUNNER_TEMP/showcc/libvsql.showcc"
          .github/workflows/hello-test.sh bin/vsql
          make release VERSION=${GITHUB_REF##*/}
          scripts/amalgamation.sh generate amalgamation-linux-${{ env.V_ARCH }} "$RUNNER_TEMP/showcc"
          scripts/amalgamation.sh check amalgamation-linux-${{ env.V_ARCH }}
          git checkout vsql/version.v
          touch bin/*

      # psql is used by the server tests. It's already installed on the x86-64
      # runner.
      - name: Install psql
        run: command -v psql || (.github/workflows/retry.sh sudo apt-get update && .github/workflows/retry.sh sudo apt-get install -y postgresql-client)

      - name: Run tests
        run: make test

      # The tests for "vsql app" drive it in a headless Chromium (see
      # docs/testing.rst). The page is the same everywhere, so they only run
      # here. --with-deps installs the libraries Chromium needs.
      - name: Run app tests
        if: env.ARCH == 'x86-64'
        run: |
          python3 -m venv "$RUNNER_TEMP/app-venv"
          . "$RUNNER_TEMP/app-venv/bin/activate"
          .github/workflows/retry.sh pip install -r app/tests/requirements.txt
          .github/workflows/retry.sh playwright install --with-deps chromium
          make app-test

      - name: Upload amalgamation C
        uses: actions/upload-artifact@v7
        with:
          name: amalgamation-linux-${{ env.V_ARCH }}
          path: amalgamation-linux-${{ env.V_ARCH }}

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ env.ARCH }}
          path: vsql-*-linux-${{ env.ARCH }}.zip
